# Servidor do robô do Nossos Achadinhos (Google Cloud, e2-micro grátis: 1 GB de memória, us-central1).
# Evolution API 2.3.8 + Postgres enxuto + túnel da Cloudflare (HTTPS em robo.nossoprojeto3d.com.br, sem abrir porta).
# Rede só IPv6 (IP v4 público é cobrado no Google; IPv6 não): os contêineres saem por IPv6 com NAT do Docker.
# Subir: ./instalar.sh (gera o .env com as senhas). Nada aqui publica porta na internet.
services:
  api:
    image: evoapicloud/evolution-api:v2.3.8
    restart: always
    env_file: .env
    depends_on: [postgres]
    volumes:
      - instancias:/evolution/instances

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # pouca memória: a máquina grátis tem 1 GB
    command: postgres -c shared_buffers=32MB -c max_connections=20 -c work_mem=2MB -c maintenance_work_mem=16MB
    volumes:
      - banco:/var/lib/postgresql/data


  tunel:
    image: cloudflare/cloudflared:2026.11.2
    restart: always
    command: tunnel --no-autoupdate --edge-ip-version 6 run --token ${TUNNEL_TOKEN}
    depends_on: [api]

volumes:
  instancias:
  banco:

networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
        - subnet: fd00:ac:1::/64
