name: App do Achadinhos (Windows e Mac)

# Gera os instaladores do app Nossos Achadinhos (Electron) em máquinas do próprio sistema,
# porque o sharp precisa do binário de cada um. Ficam sempre nos mesmos links (release achadinhos-windows):
# .../releases/download/achadinhos-windows/Nossos-Achadinhos-Setup.exe (Windows)
# .../releases/download/achadinhos-windows/Nossos-Achadinhos-Mac.dmg (Mac Apple Silicon)
on:
  push:
    branches: [main]
    paths:
      - 'achadinhos-robo-local/app/**'
      - 'achadinhos-robo-local/build/**'
      - 'achadinhos-robo-local/nucleo.mjs'
      - 'achadinhos-robo-local/whatsapp.mjs'
      - 'achadinhos-robo-local/package.json'
      - 'achadinhos-robo-local/package-lock.json'
      - '.github/workflows/achadinhos-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: achadinhos-windows
  cancel-in-progress: true

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build: win
            arquivo: dist/Nossos-Achadinhos-Setup.exe
          - os: macos-latest
            build: mac
            arquivo: dist/Nossos-Achadinhos-Mac.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: achadinhos-robo-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: achadinhos-robo-local/package-lock.json
      - run: npm ci
      # garante o Electron baixado mesmo se o npm pular os scripts de instalação
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run ${{ matrix.build }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Publicar o instalador no link fixo
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=achadinhos-windows
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Nossos Achadinhos para Windows" \
              --notes "Instaladores do app Nossos Achadinhos (bot do WhatsApp). Windows: na 1ª vez, Mais informações › Executar assim mesmo. Mac: na 1ª vez, Ajustes do Sistema › Privacidade e Segurança › Abrir mesmo assim." \
              --target "$GITHUB_SHA" --latest=false || true
          fi
          gh release upload "$TAG" "${{ matrix.arquivo }}" --clobber
