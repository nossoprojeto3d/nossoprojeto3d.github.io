<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E3A34">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Achadinhos">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-180.png">

<title>Nossos Achadinhos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E3A34; --bg2:#0B312C; --surface:#134840; --line:#2B6358; --text:#EEF6F1; --muted:#A9C7BC;
  --accent:#FFD23F; --on-accent:#0E3A34; --tk1:#FFF4D6; --tk2:#EFE0B4; --tksh:#07211D; --tktext:#0E3A34; --tksub:#2E5A50;
  --ok:#9BE8B9; --warn:#FFC98A; --wa-bg:#0B141A; --wa-out:#005C4B;
  --disp:'Bricolage Grotesque',system-ui,sans-serif; --body:'Instrument Sans',system-ui,sans-serif; --mono:'DM Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:32px 32px}
h1,h2,h3,p{margin:0}
h1{font-family:var(--disp);font-weight:700;font-size:32px;letter-spacing:-.02em;line-height:1.05}
h2{font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:-.01em}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}

/* estrutura */
.shell{min-height:100dvh;display:flex;flex-direction:column}
.side{display:none}
.main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 20px 28px;display:flex;flex-direction:column;gap:16px}
.tabs{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--bg2);border-top:1px solid var(--line);padding:6px 12px max(10px,env(safe-area-inset-bottom))}
.tab{height:52px;border:0;background:none;color:var(--muted);font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tab[aria-current="page"]{color:var(--accent)}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.top .seg{flex:1 1 100%}

/* controles */
.btn{min-height:52px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);min-height:56px;font-size:17px}
.btn.pri:disabled{background:var(--surface);border-color:var(--line);color:var(--muted);cursor:not-allowed}
a.btn{text-decoration:none}
a.btn.off{background:var(--surface);border-color:var(--line);color:var(--muted);cursor:not-allowed}
.btn.sm{min-height:44px;font-size:14px;border-radius:10px;padding:0 14px}
.btn.link{border:0;color:var(--accent);min-height:44px;padding:0 10px}
.btn.block{width:100%}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.seg button{height:44px;border-radius:10px;border:0;background:none;color:var(--muted);font-size:15px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.field{display:flex;flex-direction:column;gap:8px}
.field label,.lbl{font-size:15px;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.in{width:100%;min-height:52px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:16px}
.in::placeholder{color:#7FA89B}
textarea.in{min-height:160px;resize:vertical;line-height:1.4}
.chk{display:flex;align-items:flex-start;gap:8px;font-size:14px;min-height:20px}
.chk.ok{color:var(--ok)} .chk.warn{color:var(--warn)} .chk.neu{color:var(--muted)}
.chk svg{flex-shrink:0;margin-top:1px}
.hint{font-size:14px;color:var(--muted)}
.card{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px}
.stack{display:flex;flex-direction:column;gap:16px}
.stack.tight{gap:8px}

/* cupom impresso em camadas */
.ticket{position:relative;min-height:58px;border-radius:10px;color:var(--tktext);display:flex;align-items:center;gap:12px;padding:6px 6px 6px 22px;
  background:repeating-linear-gradient(0deg,var(--tk1) 0 3px,var(--tk2) 3px 4px);box-shadow:0 3px 0 var(--tksh)}
.ticket::before{content:"";position:absolute;left:-9px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:var(--bg)}
.ticket .code{font-family:var(--mono);font-size:17px}
.ticket .regra{flex:1;font-size:13px;font-weight:500;color:var(--tksub)}
.ticket button{width:44px;height:44px;border:0;background:none;color:var(--tktext);display:flex;align-items:center;justify-content:center}
.dashed{border-style:dashed;border-color:var(--muted);color:var(--accent)}

/* prévia do WhatsApp */
.wa{border-radius:18px;background:var(--wa-bg);padding:16px 14px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.wa .cap{align-self:flex-start;font-size:12px;color:#8696A0}
.bolha{max-width:min(310px,100%);border-radius:12px 12px 2px 12px;background:var(--wa-out);padding:10px 12px;font-family:system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.38;color:#E9EDEF;white-space:pre-wrap;overflow-wrap:anywhere}
.bolha b{font-weight:600}
.bolha .lk{color:#53BDEB}
.bolha.img{padding:4px 4px 10px;width:min(290px,100%)}
.bolha.img .txt{padding:8px 8px 0}
.bolha.img img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:9px}
.vazio{align-self:stretch;text-align:center;color:#8696A0;font-size:14px;padding:28px 8px}
.capa{aspect-ratio:1/1;border-radius:9px;background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;overflow:hidden;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:24px 24px}
.capa .tk{width:58%;aspect-ratio:2.1/1;border-radius:12px;background:repeating-linear-gradient(0deg,var(--tk1) 0 3px,var(--tk2) 3px 4px);transform:perspective(600px) rotateX(22deg) rotateY(-22deg) rotateZ(-5deg);
  box-shadow:2px 2px 0 #C9B98A,4px 4px 0 #B7A777,6px 6px 0 #A59565,18px 26px 30px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:34px;color:var(--tktext)}
.capa .tt{font-family:var(--disp);font-weight:700;font-size:34px;line-height:1;color:var(--accent)}
.capa.mini{width:64px;height:64px;flex-shrink:0;border-radius:10px;gap:0}
.capa.mini .tk{font-size:13px;border-radius:4px;box-shadow:1px 2px 0 #A59565}
.thumb{width:64px;height:64px;flex-shrink:0;border-radius:10px;object-fit:cover}

.dados{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dados label:first-child{grid-column:1/-1}
.dados label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.dados .in{min-height:46px;padding:10px 12px;border-radius:10px;font-size:16px}
.frase{display:flex;align-items:center;gap:12px;padding:6px 6px 6px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.frase div{flex:1;padding:8px 0}
.frase small{display:block;font-size:12px;color:var(--muted)}

/* histórico e ajustes */
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.item .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .d{display:flex;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.item .d .mono{color:var(--accent)}
.quem{width:26px;height:26px;border-radius:50%;border:1px solid var(--muted);color:var(--accent);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.dia{font-size:14px;font-weight:600;color:var(--muted)}
.linha{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:15px}
.linha span{flex:1;padding:8px 0}
.linha button{width:44px;height:44px;border:0;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center}
.sw{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:52px}
.sw input{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:16px;background:var(--bg2);border:1px solid var(--line);position:relative;flex-shrink:0;transition:background .15s;cursor:pointer}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.sw input:checked{background:var(--accent)} .sw input:checked::after{transform:translateX(20px);background:var(--on-accent)}

/* login */
.login{min-height:100dvh;max-width:440px;margin:0 auto;padding:max(40px,env(safe-area-inset-top)) 28px 32px;display:flex;flex-direction:column}
.marca{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:15px;font-weight:500}
.np{width:40px;height:40px;border:2px solid var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:16px;color:var(--accent)}
.palco{height:230px;display:flex;align-items:center;justify-content:center;perspective:900px;touch-action:pan-y}
.heroi{position:relative;width:250px;height:118px;border-radius:14px;display:flex;align-items:center;color:var(--tktext);
  background:repeating-linear-gradient(0deg,var(--tk1) 0 3px,var(--tk2) 3px 4px);
  transform:rotateX(calc(22deg + var(--rx,0deg))) rotateY(calc(-22deg + var(--ry,0deg))) rotateZ(-5deg);transition:transform .25s ease-out;
  box-shadow:1px 1px 0 #D8C99A,2px 2px 0 #D0C08F,3px 3px 0 #C7B784,4px 4px 0 #BEAE7A,5px 5px 0 #B5A570,6px 6px 0 #AC9C67,7px 7px 0 #A3935E,8px 8px 0 #9A8A55,9px 9px 0 #91814D,34px 46px 50px rgba(0,0,0,.5)}
.heroi::before,.heroi::after{content:"";position:absolute;top:46px;width:26px;height:26px;border-radius:50%;background:var(--bg)}
.heroi::before{left:-13px}.heroi::after{right:-13px}
.heroi .pct{width:66px;height:78px;margin-left:22px;border-right:2px dashed #8E8256;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:30px}
.heroi .cd{padding-left:18px}.heroi .cd small{display:block;font-size:12px;font-weight:600;color:var(--tksub)}.heroi .cd span{font-family:var(--mono);font-size:24px}
.boia{animation:boia 5s ease-in-out infinite}
@keyframes boia{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.login h1{font-size:42px}
.erro{color:var(--warn);font-size:14px}

/* robô do WhatsApp */
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex-shrink:0}
.dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(155,232,185,.18)}
.demo{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--accent);color:var(--on-accent);border-radius:12px;padding:4px 4px 4px 14px;font-size:14px;font-weight:600}
.demo .btn{border-color:var(--on-accent);color:var(--on-accent);flex-shrink:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 10px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:13px;font-weight:500}
.barra{height:8px;border-radius:4px;background:var(--bg2);overflow:hidden}
.barra span{display:block;height:100%;background:var(--accent);transition:width .3s}
.qr{width:208px;height:208px;align-self:center;background:#fff;border-radius:14px;padding:12px;box-sizing:border-box}
.qr svg,.qr img{display:block;width:100%;height:100%}
.ol-qr{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15px;color:var(--muted)}
.st{font-size:13px}.st.ok{color:var(--ok)}.st.falhou{color:var(--warn)}.st.enviando{color:var(--accent)}
.seg3{grid-template-columns:repeat(3,minmax(0,1fr))}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);max-width:min(420px,calc(100vw - 32px));background:var(--tk1);color:var(--tktext);font-size:15px;font-weight:500;padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* celular: oferta em dois passos */
.duo{display:flex;flex-direction:column;gap:16px}
.duo[data-step="form"] .pane-previa,.duo[data-step="previa"] .pane-form{display:none}
.pane{display:flex;flex-direction:column;gap:16px;min-width:0}
.so-web{display:none}

@media (min-width:960px){
  .shell{flex-direction:row}
  .tabs{display:none}
  .side{display:flex;flex-direction:column;gap:28px;width:240px;flex-shrink:0;padding:28px 20px;background:var(--bg2);border-right:1px solid var(--line);position:sticky;top:0;height:100dvh}
  .side nav{display:flex;flex-direction:column;gap:4px}
  .side .tab{flex-direction:row;justify-content:flex-start;gap:10px;height:44px;padding:0 14px;border-radius:10px;font-size:15px}
  .side .tab[aria-current="page"]{background:var(--surface)}
  .side .pe{margin-top:auto;display:flex;align-items:center;gap:10px}
  .main{max-width:1080px;margin:0;padding:36px 40px 48px;gap:24px}
  h1{font-size:40px}
  .top .seg{flex:0 0 260px}
  .duo{flex-direction:row;gap:32px;align-items:flex-start}
  .duo .pane{flex:1}
  .duo[data-step] .pane-previa,.duo[data-step] .pane-form{display:flex}
  .so-cel{display:none!important}
  .so-web{display:block}
  .estreito{max-width:620px}
}
@media (prefers-reduced-motion:reduce){.barra span{transition:none}.boia{animation:none}.heroi,.btn,.toast,.sw input,.sw input::after{transition:none}}
</style>
</head>

function ler(msg) {
  const linkOrig = (msg.match(/https?:\/\/\S+/) || [''])[0];
  const semLink = msg.replace(/https?:\/\/\S+/g, ' ');
  const preco = (semLink.match(/R\$\s?\d[\d.]*(?:,\d{1,2})?/) || [''])[0].replace(/R\$\s?/, 'R$ ');
  let cupom = '';
  let m = semLink.match(/\u{1F39F}️?\s*([A-Z0-9]{4,20})(?![a-z])/u) || semLink.match(/[Cc][Uu][Pp][Oo][Mm]\s*:?\s+([A-Z][A-Z0-9]{3,19})(?![a-z])/);
  if (m) cupom = m[1];
  else {
    const cand = (semLink.match(/\b[A-Z][A-Z0-9]{5,19}\b/g) || []).filter(t => /\d/.test(t));
    if (cand.length) cupom = cand[cand.length - 1];
  }
  let produto = (semLink.split('\n').map(l => l.trim()).find(l => l) || '');
  produto = produto.split(/R\$/)[0];
  if (cupom) produto = produto.replace(cupom, '');
  produto = produto.replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}️]/gu, '').replace(/\s{2,}/g, ' ').replace(/[\s\-–—:|]+$/, '').trim();
  return { produto, preco, cupom, linkOrig };
}

  marca(0, 0); marca(0, 18); marca(18, 0);
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    if ((i < 8 && j < 8) || (i < 8 && j > 16) || (i > 16 && j < 8)) continue;
    x = (x * 1103515245 + 12345) & 0x7fffffff; if (x % 100 < 47) c.push([i, j]);
  }
  return `<svg viewBox="0 0 ${n} ${n}" role="img" aria-label="QR Code de exemplo" shape-rendering="crispEdges">${c.map(([i, j]) => `<rect x="${j}" y="${i}" width="1" height="1" fill="#0E3A34"/>`).join('')}</svg>`;

/* cupom 3D do login acompanha o dedo ou o mouse */
document.addEventListener('pointermove', e => {
  const h = $('#heroi'); if (!h || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5;
  h.style.setProperty('--ry', (x * 26).toFixed(1) + 'deg'); h.style.setProperty('--rx', (-y * 18).toFixed(1) + 'deg');
});
(function entrada() {
  try {
    let m = new URLSearchParams(location.search).get('msg');
    if (!m && location.hash.startsWith('#msg=')) m = decodeURIComponent(location.hash.slice(5));
    if (!m || !m.trim()) return;
    S.msg = m.trim(); S.manual = false; S.tipo = 'oferta'; S.view = 'novo'; S.step = 'form'; S.coladaEm = Date.now();
    history.replaceState(null, '', location.pathname);
  } catch (e) {}
})();
S.img = le('na-img'); if (le('na-avisar') === '0') S.avisarRepetido = false;
iniciaRobo();
S.abrindo = NUVEM && temSessaoSalva();
if (S.abrindo) setTimeout(fimAbrindo, 10000);
render();
ligaNuvem();
</script>
</body>
</html>
