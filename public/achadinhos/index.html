<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E3A34">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Achadinhos">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" type="image/png" href="icone-192.png">
<title>Nossos Achadinhos</title>
<meta name="description" content="Monte e envie os posts de ofertas e cupons do grupo.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://nossoprojeto3d.com.br/achadinhos/">
<meta property="og:title" content="Nossos Achadinhos">
<meta property="og:description" content="Monte e envie os posts de ofertas e cupons do grupo.">
<meta property="og:image" content="https://nossoprojeto3d.com.br/achadinhos/og.jpg?v=1">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E3A34; --bg2:#0B312C; --surface:#134840; --line:#2B6358; --text:#EEF6F1; --muted:#A9C7BC;
  --accent:#FFD23F; --on-accent:#0E3A34; --tk1:#FFF4D6; --tk2:#EFE0B4; --tksh:#07211D; --tktext:#0E3A34; --tksub:#2E5A50;
  --ok:#9BE8B9; --warn:#FFC98A; --wa-bg:#0B141A; --wa-out:#005C4B;
  --disp:'Bricolage Grotesque',system-ui,sans-serif; --body:'Instrument Sans',system-ui,sans-serif; --mono:'DM Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:32px 32px}
h1,h2,h3,p{margin:0}
h1{font-family:var(--disp);font-weight:700;font-size:32px;letter-spacing:-.02em;line-height:1.05}
h2{font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:-.01em}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}

/* estrutura */
.shell{min-height:100dvh;display:flex;flex-direction:column}
.side{display:none}
.main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 20px calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
/* fixed (não sticky): no app da tela de início do iPhone, o 100dvh vem errado ao abrir e a barra ficava no meio */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--bg2);border-top:1px solid var(--line);padding:6px 12px max(10px,env(safe-area-inset-bottom))}
.tab{height:52px;border:0;background:none;color:var(--muted);font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tab[aria-current="page"]{color:var(--accent)}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.top .seg{flex:1 1 100%}

/* controles */
.btn{min-height:52px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);min-height:56px;font-size:17px}
.btn.pri:disabled{background:var(--surface);border-color:var(--line);color:var(--muted);cursor:not-allowed}
a.btn{text-decoration:none}
a.btn.off{background:var(--surface);border-color:var(--line);color:var(--muted);cursor:not-allowed}
.btn.sm{min-height:44px;font-size:14px;border-radius:10px;padding:0 14px}
.btn.link{border:0;color:var(--accent);min-height:44px;padding:0 10px}
.btn.block{width:100%}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.seg button{height:44px;border-radius:10px;border:0;background:none;color:var(--muted);font-size:15px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.field{display:flex;flex-direction:column;gap:8px}
.field label,.lbl{font-size:15px;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.in{width:100%;min-height:52px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:16px}
.in::placeholder{color:#7FA89B}
textarea.in{min-height:160px;resize:vertical;line-height:1.4}
.chk{display:flex;align-items:flex-start;gap:8px;font-size:14px;min-height:20px}
.chk.ok{color:var(--ok)} .chk.warn{color:var(--warn)} .chk.neu{color:var(--muted)}
.chk svg{flex-shrink:0;margin-top:1px}
.hint{font-size:14px;color:var(--muted)}
.card{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px}
.pl{display:flex;gap:12px;align-items:center;padding:10px}
.pl-foto{width:64px;height:64px;flex-shrink:0;border-radius:10px;background:#fff;object-fit:contain}
.pl.carregando .pl-foto{background:var(--line);animation:pisca 1.2s ease-in-out infinite}
.pl-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.pl-txt b{font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pl-ok{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ok);min-width:0;white-space:nowrap}
.pl-ok .mono{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:600 13.5px var(--body);cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
@media (max-width:1023px){.chip{min-height:40px}}
#modelo{min-height:240px;font-size:15px;line-height:1.5;resize:vertical}
.modelo-duo{display:flex;flex-direction:column;gap:20px}
.modelo-img{margin-top:12px;padding-top:16px;border-top:1px solid var(--line)}
.emojis{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:2px;padding:8px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.emo{min-height:40px;border:0;border-radius:8px;background:none;font-size:22px;line-height:1;cursor:pointer}
.emo:hover,.emo:focus-visible{background:var(--line)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.bolha i{font-style:italic} .bolha s{text-decoration:line-through}
.passos-ml{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.passos-ml a{color:var(--accent)}
details.hint summary{cursor:pointer;min-height:32px;display:flex;align-items:center}
@keyframes pisca{50%{opacity:.45}}
@media (prefers-reduced-motion: reduce){.pl.carregando .pl-foto{animation:none}}
.stack{display:flex;flex-direction:column;gap:16px}
.stack.tight{gap:8px}

/* cupom impresso em camadas */
.ticket{position:relative;min-height:58px;border-radius:10px;color:var(--tktext);display:flex;align-items:center;gap:12px;padding:6px 6px 6px 22px;
  background:repeating-linear-gradient(0deg,var(--tk1) 0 3px,var(--tk2) 3px 4px);box-shadow:0 3px 0 var(--tksh)}
.ticket::before{content:"";position:absolute;left:-9px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:var(--bg)}
.ticket .code{font-family:var(--mono);font-size:17px}
.ticket .regra{flex:1;font-size:13px;font-weight:500;color:var(--tksub)}
.ticket button{width:44px;height:44px;border:0;background:none;color:var(--tktext);display:flex;align-items:center;justify-content:center}
.dashed{border-style:dashed;border-color:var(--muted);color:var(--accent)}

/* prévia do WhatsApp */
.wa{border-radius:18px;background:var(--wa-bg);padding:16px 14px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.wa .cap{align-self:flex-start;font-size:12px;color:#8696A0}
.bolha{max-width:min(310px,100%);border-radius:12px 12px 2px 12px;background:var(--wa-out);padding:10px 12px;font-family:system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.38;color:#E9EDEF;white-space:pre-wrap;overflow-wrap:anywhere}
.bolha b{font-weight:600}
.msg{display:flex;flex-direction:column;align-items:flex-end;gap:6px;width:100%}
.macoes{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.macoes .btn.sm{min-height:40px;padding:0 12px;font-size:13.5px;gap:6px;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);color:#E9EDEF}
.macoes .btn.sm.feito,.macoes.feito .btn.sm{opacity:.7}
.tiques{float:right;margin:6px 0 -4px 10px;font-size:12px;letter-spacing:-3px;color:#53BDEB;font-family:system-ui}
.bolha .lk{color:#53BDEB}
.bolha.img{padding:4px 4px 10px;width:min(290px,100%)}
.bolha.img .txt{padding:8px 8px 0}
.bolha.img img{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:cover;border-radius:9px}
.vazio{align-self:stretch;text-align:center;color:#8696A0;font-size:14px;padding:28px 8px}
.capa{aspect-ratio:1/1;border-radius:9px;background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;overflow:hidden;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:24px 24px}
.capa .tk{width:58%;aspect-ratio:2.1/1;border-radius:12px;background:repeating-linear-gradient(0deg,var(--tk1) 0 3px,var(--tk2) 3px 4px);transform:perspective(600px) rotateX(22deg) rotateY(-22deg) rotateZ(-5deg);
  box-shadow:2px 2px 0 #C9B98A,4px 4px 0 #B7A777,6px 6px 0 #A59565,18px 26px 30px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:34px;color:var(--tktext)}
.capa .tt{font-family:var(--disp);font-weight:700;font-size:34px;line-height:1;color:var(--accent)}
.capa.mini{width:64px;height:64px;flex-shrink:0;border-radius:10px;gap:0}
.capa.mini .tk{font-size:13px;border-radius:4px;box-shadow:1px 2px 0 #A59565}
.thumb{width:64px;height:64px;flex-shrink:0;border-radius:10px;object-fit:cover}

.dados{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.dados .prod{grid-column:1/-1;display:flex;flex-direction:column;gap:2px}
.dados .prod label{font-size:12px;color:var(--muted)}
.ph{opacity:.55;font-style:italic}
.dados label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.dados .in{min-height:46px;padding:10px 12px;border-radius:10px;font-size:16px}
.frase{display:flex;align-items:center;gap:12px;padding:6px 6px 6px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.frase div{flex:1;padding:8px 0}
.frase small{display:block;font-size:12px;color:var(--muted)}

/* histórico e ajustes */
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.item .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .d{display:flex;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.item .d .mono{color:var(--accent)}
.nums{display:flex;flex-direction:column;gap:10px}
.nums-top{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nums-top b{display:block;font-family:var(--disp);font-size:28px;line-height:1.1;color:var(--accent)}
.nums-top span{font-size:12px;color:var(--muted)}
.barras{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:64px;align-items:end}
.barras div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.barras i{display:block;width:100%;max-width:26px;min-height:3px;border-radius:5px 5px 2px 2px;background:var(--accent)}
.barras span{font-size:11px;color:var(--muted)}
.nums .d{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}
.btn-reusar{min-width:44px;min-height:44px}
@media (max-width:520px){.txt-reusar{display:none}}
.item-box{display:flex;flex-direction:column}
.item-box .item:has(+ .aviso-painel){border-bottom-left-radius:4px;border-bottom-right-radius:4px}
.item .d .esgotado{text-decoration:line-through;opacity:.75}
.item .d .esgotado small{text-decoration:none;display:inline-block;color:var(--muted)}
.aviso-painel{margin-top:4px;padding:10px 14px;border-radius:4px 4px 14px 14px;background:var(--bg2);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.aviso-linha{display:flex;align-items:center;justify-content:space-between;gap:10px}
.aviso-linha .mono{color:var(--accent)}
.aviso-linha .btn{min-height:44px;min-width:96px}
.item.aviso{padding:10px 14px;background:transparent;border-style:dashed}
.item.aviso .t{font-size:14px;font-weight:500}
.item.aviso .mono{color:var(--accent)}
.aviso-ico{font-size:18px}
.hist{display:flex;flex-direction:column;gap:12px}
.hf{display:flex;gap:8px;flex-wrap:wrap}
.com-acao{position:relative}
.com-acao > input.in.in{padding-right:100px}
.com-acao > textarea.in.in{padding-bottom:54px}
.acao-in{position:absolute;right:6px;top:50%;transform:translateY(-50%);height:36px;min-width:44px;padding:0 10px;display:flex;align-items:center;gap:5px;border:1px solid rgba(255,210,63,.4);border-radius:999px;background:var(--bg2);color:var(--accent);font-size:13px;font-weight:600;cursor:pointer}
.acao-in::before{content:'';position:absolute;inset:-4px}
.com-acao textarea + .acao-in{top:auto;bottom:10px;right:12px;transform:none}
.acao-in:active{background:rgba(255,255,255,.08)}
.acao-in:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.origem{grid-template-columns:repeat(2,minmax(0,1fr))!important;margin-bottom:4px;flex:none!important}
.seg.mini{flex:1;min-width:0;grid-template-columns:repeat(3,minmax(0,1fr));border-radius:12px}
.seg.mini button{height:34px;font-size:13px;padding:0 6px;border-radius:8px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-width:0}
.kpi-l{font-size:12px;color:var(--muted)}
.kpi b{font-family:var(--disp);font-size:26px;line-height:1.1;color:var(--accent)}
.kpi-s{font-size:11.5px;color:var(--muted);line-height:1.3}
.kpi-s.sobe{color:var(--ok)}
.kpi-s.desce{color:var(--warn)}
.cv{position:relative;width:100%}
.cv canvas{display:none}
.cv.cj canvas{display:block}
.cv.cj .fb{display:none}
.cv-dias{height:130px}
.cv-dias .barras{height:100%}
.cv-horas{height:84px}
.cv-horas .fb{padding-top:30px}
.tipo-g{display:flex;align-items:center;gap:16px}
.cv-tipo{width:96px;height:96px;flex-shrink:0}
.tipo-fb{width:100%;height:100%;border-radius:50%;background:conic-gradient(var(--accent) 0 var(--p),var(--tk2) var(--p) 100%);-webkit-mask:radial-gradient(circle,transparent 58%,#000 60%);mask:radial-gradient(circle,transparent 58%,#000 60%)}
.tipo-l{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.tipo-l b{color:var(--text);margin-left:4px}
.lg{display:inline-block;width:9px;height:9px;border-radius:3px;margin:0 4px 0 8px;vertical-align:0}
.tipo-l .lg{margin-left:0}
.lg.a{background:var(--accent)}
.lg.b{background:var(--tk2)}
.hist-graf,.hist-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.graf-extra{display:none;flex-direction:column;gap:12px}
.graf-extra.on{display:flex}
.graf-tog{align-self:center}
.graf{display:flex;flex-direction:column;gap:8px}
.graf-t{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:15px}
.graf-t small{font-weight:500;color:var(--muted);font-size:12px}
.barras em{font-style:normal;font-size:11px;color:var(--muted);min-height:13px}
.horas{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;height:34px}
.horas i{border-radius:4px;background:var(--accent)}
.horas-l{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.dupla{display:flex;flex-direction:column;gap:6px}
.dupla-b{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px}
.dupla-b i{display:block;background:var(--accent)}
.dupla-b i.b{background:var(--tk2)}
.dupla-l{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.dupla-l strong{color:var(--text);margin-left:4px}
.dupla-l span{display:flex;align-items:center;gap:6px}
.dupla-l .pa,.dupla-l .pb{width:9px;height:9px;border-radius:3px;background:var(--accent);display:inline-block}
.dupla-l .pb{background:var(--tk2)}
.rank{display:flex;flex-direction:column;gap:8px}
.rank-l{display:grid;grid-template-columns:minmax(0,9.5em) 1fr auto;gap:10px;align-items:center;font-size:13px}
.rank-l .mono{color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-l .esgotado{text-decoration:line-through;opacity:.7}
.rank-b{height:8px;border-radius:4px;background:var(--bg2);overflow:hidden}
.rank-b i{display:block;height:100%;background:var(--accent);border-radius:4px}
.rank-l b{font-weight:600;color:var(--muted);font-size:12px}
.chip-c{padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--bg2)}
.chip-c small{color:var(--muted)}
.quem{width:26px;height:26px;border-radius:50%;border:1px solid var(--muted);color:var(--accent);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.dia{font-size:14px;font-weight:600;color:var(--muted)}
.linha{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:15px}
.linha span{flex:1;padding:8px 0}
.linha button{width:44px;height:44px;border:0;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center}
.sw{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:52px}
.sw input{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:16px;background:var(--bg2);border:1px solid var(--line);position:relative;flex-shrink:0;transition:background .15s;cursor:pointer}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.sw input:checked{background:var(--accent)} .sw input:checked::after{transform:translateX(20px);background:var(--on-accent)}

/* login */
.login{min-height:100dvh;max-width:440px;margin:0 auto;padding:max(40px,env(safe-area-inset-top)) 28px 32px;display:flex;flex-direction:column}
.marca{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:15px;font-weight:500}
.np{width:44px;height:44px;flex-shrink:0;border-radius:10px;background:var(--tk1);display:flex;align-items:center;justify-content:center}
.np img{display:block;width:26px;height:auto}
.palco{height:230px;display:flex;align-items:center;justify-content:center;perspective:900px;touch-action:pan-y}

  const cupons = [], regras = {};

function telaDisparo() {

/* Novo post e Clonar oferta são a mesma tela (view 'novo'), no modo Do zero ou Mensagem pronta */
const ABAS = [['zero', 'Novo post', 'mais'], ['clonar', 'Clonar oferta', 'copiar'], ['historico', 'Histórico', 'relogio'], ['modelo', 'Template', 'modelo'], ['ajustes', 'Ajustes', 'ajustes']];
const modoZero = () => S.tipo === 'oferta' ? !!S.manual : !!S.cZero;
const abaAtual = () => S.view !== 'novo' ? S.view : modoZero() ? 'zero' : 'clonar';
const abas = () => ABAS.map(([id, nome, ic]) => `<button class="tab" data-a="${id === 'zero' || id === 'clonar' ? 'ir-novo' : 'ir'}" data-n="${id}" ${abaAtual() === id ? 'aria-current="page"' : ''}>${ico(ic, 22)}${id === 'clonar' ? '<span class="so-web">Clonar oferta</span><span class="so-cel">Clonar</span>' : nome}</button>`).join('');
/* põe a oferta ou o cupom no modo da aba (as trocas guardam o que estava no outro modo) */
function sincModo(zero) {
  if (S.tipo === 'oferta' && !!S.manual !== zero) A.origem(zero ? 'zero' : 'pronta');
  if (S.tipo === 'cupom' && !!S.cZero !== zero) A['origem-c'](zero ? 'zero' : 'pronta');
}
function render() {
  const app = $('#app');
  if (S.abrindo) { app.innerHTML = telaAbrindo(); return; }
  if (!S.dentro) { app.innerHTML = telaLogin(); return; }
  if (!S.user) { app.innerHTML = telaQuem(); return; }
  const tela = S.view === 'novo' ? telaNovo() : S.view === 'historico' ? telaHistorico() : S.view === 'modelo' ? telaModelo() : telaAjustes();
  app.innerHTML = `<div class="shell">
    <aside class="side"><div class="marca" style="color:var(--text)"><div class="np"><img src="logo-np-verde.png" alt="Nosso Projeto 3D" width="26" height="31"></div><span style="font-family:var(--disp);font-weight:700;font-size:19px;line-height:1.05">Nossos Achadinhos</span></div>
      <nav aria-label="Principal">${abas()}</nav>
      <div class="pe"><span class="quem" aria-hidden="true" style="width:36px;height:36px;font-size:14px">${esc(S.user[0])}</span><span class="lbl">${esc(S.user)}</span></div></aside>
    <main class="main${(S.view === 'novo' && !S.disparo && !S.envio) || (S.view === 'historico' && S.historico.length) || S.view === 'modelo' ? ' fixa' : ''}" id="main">${tela}</main>
    <nav class="tabs" aria-label="Principal">${abas()}</nav>
  </div>`;
  montaGraficos();
}

document.addEventListener('submit', e => {

        sb.auth.signUp({ email: em, password: se, options: { emailRedirectTo: location.origin + location.pathname } }).then(({ data, error }) => {

        }).catch(() => { bt.disabled = false; erro('#erro-login', 'Sem conexão com o servidor. Tente de novo em instantes.'); });
